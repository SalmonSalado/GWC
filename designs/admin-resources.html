<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin A – Sidebar dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f7f7a}a:hover{color:#14213d}
</style>
</helmet>
<div style="min-height: 900px; background: #f6f5f1; color: #14213d; font-family: 'Space Grotesk', sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="Admin sections" style="flex: 1 1 240px; max-width: 280px; background: #14213d; color: #f6f5f1; padding: 28px 20px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#fde1ea"></circle><g fill="none" stroke="#1aa5a0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22 L26 32 L14 42"></path><path d="M31 44 H48"></path></g></svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px">GWC Admin</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #c9cdd8">Rutgers–Newark</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: #f6f5f1; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><circle cx="17.5" cy="9" r="2.5"></circle><path d="M17 14.5c2.3.2 4 1.8 4.5 4.5"></path></svg>E-board</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: #f6f5f1; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Posts</a>
      <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: #f08bab; color: #14213d; text-decoration: none; font-size: 15px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Resources</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: #f6f5f1; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>Photos</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: #f6f5f1; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>Admins</a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #34405e; padding-top: 18px">
      <span style="font-size: 13px; color: #c9cdd8">Signed in as</span>
      <span style="font-size: 14px; font-weight: 500">[your email]</span>
      <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #f6f5f1; background: transparent; color: #f6f5f1; font: inherit; font-size: 14px; cursor: pointer">Sign out</button>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 36px; font-weight: 700">Resources</h1>
        <p style="margin: 0; font-size: 16px; color: #4a5470">Links the e-board shares with members. They show up in the Resources window on the site.</p>
      </div>
      <button type="button" style="min-height: 48px; padding: 0 24px; border-radius: 999px; border: 2px solid #14213d; background: #14213d; color: #f6f5f1; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">+ Add resource</button>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
      <section aria-label="All resources" style="flex: 999 1 480px; min-width: 0; background: #ffffff; border: 2px solid #14213d; border-radius: 16px; overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 15px">
          <thead>
            <tr style="text-align: left; font-family: 'Space Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #4a5470">
              <th style="padding: 16px 20px; border-bottom: 2px solid #14213d">Title</th>
              <th style="padding: 16px 12px; border-bottom: 2px solid #14213d">Category</th>
              <th style="padding: 16px 12px; border-bottom: 2px solid #14213d">Added by</th>
              <th style="padding: 16px 20px; border-bottom: 2px solid #14213d; text-align: right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
              <tr>
                <td style="padding: 16px 20px; border-bottom: 1px solid #e3e1da; font-weight: 500">{{r.title}}</td>
                <td style="padding: 16px 12px; border-bottom: 1px solid #e3e1da"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; background: #fde4ec; font-size: 13px">{{r.cat}}</span></td>
                <td style="padding: 16px 12px; border-bottom: 1px solid #e3e1da; color: #4a5470">{{r.by}}</td>
                <td style="padding: 10px 20px; border-bottom: 1px solid #e3e1da; text-align: right; white-space: nowrap">
                  <button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: none; color: #0f7f7a; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Edit</button>
                  <button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: none; color: #b8361d; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Delete</button>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>

      <aside aria-label="New resource" style="flex: 1 1 300px; max-width: 360px; background: #fde4ec; border: 2px solid #14213d; border-radius: 16px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 20px">New resource</h2>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Title
          <input type="text" placeholder="e.g. Resume template" style="min-height: 44px; padding: 0 14px; border: 2px solid #14213d; border-radius: 10px; background: #f6f5f1; font: inherit; font-weight: 400"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Link
          <input type="url" placeholder="https://" style="min-height: 44px; padding: 0 14px; border: 2px solid #14213d; border-radius: 10px; background: #f6f5f1; font: inherit; font-weight: 400"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Category
          <select style="min-height: 44px; padding: 0 12px; border: 2px solid #14213d; border-radius: 10px; background: #f6f5f1; font: inherit; font-weight: 400"><option>Career</option><option>Learning</option><option>Hackathons</option><option>Scholarships</option><option>Tools</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Short description
          <textarea rows="3" placeholder="One or two lines about why it's useful" style="padding: 10px 14px; border: 2px solid #14213d; border-radius: 10px; background: #f6f5f1; font: inherit; font-weight: 400; resize: vertical"></textarea></label>
        <div style="display: flex; gap: 10px">
          <button type="button" style="flex: 1; min-height: 48px; border-radius: 999px; border: 2px solid #14213d; background: #14213d; color: #f6f5f1; font: inherit; font-weight: 500; cursor: pointer">Publish</button>
          <button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid #14213d; background: transparent; color: #14213d; font: inherit; cursor: pointer">Cancel</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'Resume template', cat: 'Career', by: 'Secretary' },
        { title: 'Intro to Git & GitHub', cat: 'Learning', by: 'President' },
        { title: 'Internship tracker sheet', cat: 'Career', by: 'Treasurer' },
        { title: 'Hackathon starter kit', cat: 'Hackathons', by: 'Event manager' },
        { title: '[Scholarship list]', cat: 'Scholarships', by: 'Secretary' }
      ]
    };
  }
}
</script>
</body>
</html>
